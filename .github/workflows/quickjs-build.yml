name: QuickJS Build Matrix

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Cross-compile every native target and wasm32-wasi from one Linux runner
  # with `zig cc` (see scripts/build.sh and toolchains/zig.cmake).
  # ----------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # name:     release artifact, see `scripts/build.sh --list`
          # test:     run the test suite on this runner (natively or emulated)
          # packages: apt packages needed to run the binaries
          # emulator: CMAKE_CROSSCOMPILING_EMULATOR used by ctest
          - name: linux-x86_64
            test: true
          - name: linux-arm64
            test: true
            packages: qemu-user libc6-arm64-cross
            emulator: qemu-aarch64;-L;/usr/aarch64-linux-gnu
          - name: linux-armv7
            test: true
            packages: qemu-user libc6-armhf-cross
            emulator: qemu-arm;-L;/usr/arm-linux-gnueabihf
            # qemu-user cannot hand the 64-bit directory offsets of ext4 to a
            # 32-bit readdir(): os.readdir() fails with EOVERFLOW under
            # emulation only (the test passes on tmpfs and on real hardware).
            ctest_args: -E test_std
          - name: linux-riscv64
            test: true
            packages: qemu-user libc6-riscv64-cross
            emulator: qemu-riscv64;-L;/usr/riscv64-linux-gnu
          - name: linux-x86
            test: true
            packages: libc6-i386
          - name: linux-x86_64-musl
            test: true
          - name: linux-arm64-musl
            test: true
            packages: qemu-user
            emulator: qemu-aarch64
          # Windows and macOS binaries are executed by the `smoke` job below.
          - name: windows-x86_64
          - name: windows-arm64
          - name: windows-x86
          - name: macos-x86_64
          - name: macos-arm64
          # Built and linked only: no hosted runner can execute it.
          - name: freebsd-x86_64
          # The embedding smoke test runs with the WASI support of Node.js.
          - name: wasm32-wasi
            test: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install zig
        run: |
          python -m pip install "ziglang==$(cat .zigversion)"
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s" -m ziglang "$@"\n' "$(command -v python)" > "$RUNNER_TEMP/bin/zig"
          chmod +x "$RUNNER_TEMP/bin/zig"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install the emulator
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - name: Build
        env:
          QJS_EMULATOR: ${{ matrix.emulator }}
          QJS_CTEST_ARGS: ${{ matrix.ctest_args }}
        run: |
          zig version
          sh scripts/build.sh ${{ matrix.test && '--test' || '' }} ${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: qjs-${{ matrix.name }}
          path: dist/qjs-${{ matrix.name }}.zip
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Emscripten is built with its own SDK: zig does not ship its sysroot.
  # ----------------------------------------------------------------------------
  emscripten:
    name: wasm32-emscripten
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
      - name: Build
        run: |
          emcc --version
          sh scripts/build.sh --test wasm32-emscripten
      - uses: actions/upload-artifact@v7
        with:
          name: qjs-wasm32-emscripten
          path: dist/qjs-wasm32-emscripten.zip
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Alternative Windows archives built natively with MinGW-w64 11 (GCC 13.2,
  # msvcrt), for MinGW toolchains that cannot link the zig archives.
  #
  # MinGW-w64 12 changed winpthreads to 64-bit time_t symbols: code compiled
  # with its headers references clock_gettime64 and pthread_cond_timedwait64,
  # which older MinGW-w64 releases do not have. The zig archives (and anything
  # built with a current MSYS2) are on the new side of that change. These ones
  # are built with a pinned pre-12 toolchain so they link with older MinGW-w64
  # releases too; the windows-link job checks them with a current MSYS2.
  # ----------------------------------------------------------------------------
  mingw:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64-mingw
            toolchain: x86_64-13.2.0-release-posix-seh-msvcrt-rt_v11-rev1.7z
            sha256: 7d3f84b17b235aa233f0fb5df9765bf79dbea950177a69ff99f8ad1d75b0aa6e
            root: mingw64
          - name: windows-x86-mingw
            toolchain: i686-13.2.0-release-posix-dwarf-msvcrt-rt_v11-rev1.7z
            sha256: 90674ea38155173c9952e69efe59809be6379f0f610cac5a6ad207161bd10025
            root: mingw32
    env:
      MINGW_BUILDS_URL: https://github.com/niXman/mingw-builds-binaries/releases/download/13.2.0-rt_v11-rev1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install MinGW-w64
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o mingw.7z "$MINGW_BUILDS_URL/${{ matrix.toolchain }}"
          echo "${{ matrix.sha256 }}  mingw.7z" | sha256sum -c -
          7z x -y -bd mingw.7z > /dev/null
          bin=$(cygpath -w "$PWD/${{ matrix.root }}/bin")
          echo "$bin" >> "$GITHUB_PATH"
          echo "MINGW_BIN=$bin" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          "$MINGW_BIN/gcc.exe" --version
          cmake -G "MinGW Makefiles" -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$MINGW_BIN/gcc.exe" \
            -DCMAKE_MAKE_PROGRAM="$MINGW_BIN/mingw32-make.exe" \
            -DQJS_BUILD_SMOKE_TEST=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          mkdir -p pkg dist
          cp build/libqjs.a build/qjsc.exe build/quickjs.exe build/run-test262.exe pkg/
          cp -R include pkg/include
          cp VERSION pkg/VERSION
          cp LICENSE.quickjs pkg/LICENSE
          (cd pkg && cmake -E tar cf ../dist/qjs-${{ matrix.name }}.zip --format=zip -- *)
      - uses: actions/upload-artifact@v7
        with:
          name: qjs-${{ matrix.name }}
          path: dist/qjs-${{ matrix.name }}.zip
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Run the cross-compiled binaries on real machines and link the static
  # library with the compiler of the platform, as a user of the archive would.
  # ----------------------------------------------------------------------------
  smoke:
    name: run ${{ matrix.artifact }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-x86_64
            os: ubuntu-24.04
            cc: gcc
            libs: -lm -lpthread -ldl
          - artifact: macos-arm64
            os: macos-latest
            cc: cc
            libs: -lm -lpthread
          - artifact: macos-x86_64
            os: macos-15-intel
            cc: cc
            libs: -lm -lpthread
          - artifact: windows-x86_64
            os: windows-latest
          - artifact: windows-x86
            os: windows-latest
          - artifact: windows-arm64
            os: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: qjs-${{ matrix.artifact }}
          path: dist
      - name: Unpack
        run: |
          mkdir pkg
          cd pkg
          unzip -q ../dist/qjs-${{ matrix.artifact }}.zip
          ls -l
      - name: Run the QuickJS tests
        run: |
          for t in test_closure test_language test_loop test_bigint test_cyclic_import test_worker; do
            echo "== $t"
            pkg/quickjs "tests/$t.js"
          done
          echo "== test_builtin"
          pkg/quickjs --std tests/test_builtin.js
          if [ "$RUNNER_OS" != "Windows" ]; then
            echo "== test_std"
            pkg/quickjs tests/test_std.js
            echo "== test_rw_handler"
            pkg/quickjs tests/test_rw_handler.js
          fi
      - name: Link the library with the system compiler
        if: matrix.cc
        run: |
          ${{ matrix.cc }} -O2 -Ipkg/include smoke/embed.c pkg/libqjs.a ${{ matrix.libs }} -o embed
          ./embed

  # ----------------------------------------------------------------------------
  # Link the Windows archives with the current MSYS2 toolchains, as a user
  # would. windows-x86_64 (zig, UCRT) must link with UCRT64 and
  # windows-x86_64-mingw (MinGW-w64 11, msvcrt) with MINGW64. The zig archive
  # with MINGW64 mixes two C runtimes and is reported for information only.
  # ----------------------------------------------------------------------------
  windows-link:
    name: link ${{ matrix.artifact }} with MSYS2 ${{ matrix.msystem }}
    needs: [build, mingw]
    runs-on: windows-latest
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: windows-x86_64
            msystem: UCRT64
            package: mingw-w64-ucrt-x86_64-gcc
            optional: false
          - artifact: windows-x86_64
            msystem: MINGW64
            package: mingw-w64-x86_64-gcc
            optional: true
          - artifact: windows-x86_64-mingw
            msystem: MINGW64
            package: mingw-w64-x86_64-gcc
            optional: false
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.package }} unzip
      - uses: actions/download-artifact@v8
        with:
          name: qjs-${{ matrix.artifact }}
          path: dist
      - name: Link and run
        run: |
          mkdir pkg
          (cd pkg && unzip -q ../dist/qjs-${{ matrix.artifact }}.zip)
          gcc --version
          gcc -O2 -Ipkg/include smoke/embed.c pkg/libqjs.a -lm -lpthread -static -o embed.exe
          ./embed.exe

  # ----------------------------------------------------------------------------
  # Attach the archives and their checksums to a published release.
  # ----------------------------------------------------------------------------
  release:
    name: Upload release assets
    if: github.event_name == 'release'
    needs: [build, emscripten, mingw, smoke, windows-link]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: qjs-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum qjs-*.zip | tee SHA256SUMS
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/qjs-*.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
